                type: string
                format: binary
        "400":
          description: Malformed period (`INVALID_PERIOD`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                    required:
                      - code
                required:
                  - error
  /healthz:
    get:
      summary: Liveness probe (unauthenticated)
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
