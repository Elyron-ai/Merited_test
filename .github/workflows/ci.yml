# FND-16: the CI skeleton (§8 testing bar). Six jobs; later workstreams
# append into the commented slots rather than restructuring. Required
# checks on main are a repository setting — list every job name there.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

  typecheck:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build # tsc -b per package (project references)

  lint:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint # includes FND-15's merited/no-refresh-token

  unit:
    # Docker-free and fast (< 5 min): the pure packages only. Everything
    # touching Postgres lives in the integration lane.
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @merited/contracts --filter @merited/signing --filter @merited/lint-rules build
      - run: pnpm --filter @merited/contracts --filter @merited/signing --filter @merited/lint-rules test

  integration:
    # Real Postgres via the repo's own compose file (init.sql provisions the
    # D8 roles); runs the FULL workspace suite — including PH1-6's MCP
    # inspector gate (apps/mcp-server drives all three tools over the MCP
    # protocol against a real Core+trio) — FND-10..13's events/
    # projections/verify-chain suites and every module's integration tests.
    # A tampered chain turns this job red (the verify-chain suite proves
    # tamper detection on every run).
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres redis
      - run: pnpm -r build
      - run: pnpm db:migrate
      - run: pnpm -r test
      - if: always()
        run: docker compose down -v

  hygiene:
    # D8 migration checksums + FND-15's contracts d.ts grep (the grep ships
    # as a @merited/lint-rules test and needs the built dist).
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/check-checksums.mjs
      - run: pnpm --filter @merited/contracts build
      - run: pnpm --filter @merited/lint-rules test

  demo-e2e:
    # VAL-14 (§8): "one end-to-end test that is literally the demo script in
    # CI against simulators + FakeShop" — the SAME step list as pnpm
    # demo:act1, CI mode. XC-8: mutation.test.ts proves the step asserts
    # are load-bearing (disabling replay rejection fails this job).
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres redis
      - run: pnpm -r build
      - run: pnpm db:migrate
      - run: pnpm --filter @merited/demo exec vitest run test/act1.e2e.test.ts test/mutation.test.ts
      - if: always()
        run: docker compose down -v

  demo-clean-machine:
    # VAL-15 (§9 gate): a bare checkout — no cached state, no pre-started
    # containers — runs ONLY `pnpm install && pnpm demo:act1`. The bootstrap
    # does everything else (preflight, compose up, migrations, Act 1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install
      - run: MERITED_DEMO_MODE=ci pnpm demo:act1

  contract-suite:
    # XC-12 + PH1-23: the trio acceptance gate, dual-target. One suite:
    #   simulator — the harness boots the tree's trio in-process (default)
    #   real-http — apps/trio/scripts/serve.mjs boots the SAME tree as an
    #               out-of-process HTTP server and the unmodified suite runs
    #               against it (TRIO_TARGET_URL) — the exact posture the
    #               PH1-24…26/30 real implementations are accepted in.
    # A staging-KMS deployment slots in by pointing TRIO_TARGET_URL at it:
    #   TRIO_TARGET_URL: ${{ vars.TRIO_STAGING_URL }}
    #   MERITED_TRIO_SERVICE_TOKEN: ${{ secrets.TRIO_STAGING_SERVICE_TOKEN }}
    # Any suite edit after the real-implementation work starts is an XC-7
    # change-control event logged in the audit pack (§7 Accept).
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        target: [simulator, real-http]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres fake-kms
      - run: pnpm -r build
      - if: matrix.target == 'simulator'
        run: pnpm trio:contract-test
      - if: matrix.target == 'real-http'
        # PH1-24: the real-http leg runs REAL crypto — Ed25519 custody over
        # fake-kms; the suite signs claims through the trio's own
        # custodied-key signing call. This is the §7 acceptance posture.
        run: |
          TRIO_CRYPTO=ed25519 MERITED_TRIO_SERVICE_TOKEN=ci-real-http-token node apps/trio/scripts/serve.mjs &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4590/healthz > /dev/null && break; sleep 1;
          done
          TRIO_TARGET_URL=http://127.0.0.1:4590 \
          MERITED_TRIO_SERVICE_TOKEN=ci-real-http-token \
          MERITED_TEST_CRYPTO=ed25519 \
          pnpm trio:contract-test
      - if: always()
        run: docker compose down -v

  # ── reserved slots (append, don't restructure) ──────────────────────────

  dependency-audit:
    # W16 (supply-chain): CVE scan of the dependency tree. The CRITICAL gate
    # BLOCKS (green today — no critical advisories); the full report is advisory
    # (|| true) so pre-existing high/moderate advisories surface in the log
    # without turning CI red. The currently-open fixable HIGHs (drizzle-orm
    # >=0.45.2, nodemailer >=9.0.1) are tracked for a dependency bump in
    # docs/launch-readiness.md (A17) — raise the gate to --audit-level=high once
    # they are cleared.
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: corepack enable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: audit report (advisory — every advisory, never fails)
        run: pnpm audit || true
      - name: audit gate (fails on CRITICAL)
        run: pnpm audit --audit-level=critical

  codeql:
    # W16 (SAST): CodeQL for JS/TS, build-mode none (no compilation needed).
    # continue-on-error so a private repo WITHOUT GitHub Advanced Security — the
    # SARIF upload needs code scanning enabled — does not block the pipeline; the
    # analysis still runs. Enable code scanning to surface results (launch-readiness A17).
    runs-on: ubuntu-latest
    needs: install
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: github/codeql-action/init@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3

  secret-scan:
    # W16 (secret scanning): trufflehog — license-free (unlike gitleaks-action,
    # which needs a paid key for organisation repos). Verified-only keeps false
    # positives from spuriously failing CI; a verified live credential fails it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          extra_args: --only-verified

  security-review:
    # XC-3 (SYN-32): PRs touching a high-scrutiny zone (table XC.7) must
    # carry the PR template's completed "Security self-review" section.
    # PR-only — pushes to main have already passed it at merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node tools/ci/check-security-review.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
